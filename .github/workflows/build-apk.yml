name: Build APK

# Build APK otomatis dan simpan sebagai artifact supaya bisa diunduh dari tab
# Actions tanpa perlu akses ke server.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Tampilkan versi
        run: |
          flutter --version
          dart --version

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis statis
        # --fatal-infos dimatikan supaya warning gaya kode tidak menggagalkan
        # build. Error tetap membuat build gagal.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Jalankan test
        run: flutter test --no-pub

      - name: Siapkan google-services.json
        # Plugin `com.google.gms.google-services` MEMBANGGUN build kalau file ini
        # tidak ada, dan tidak ada fallback yang sah: aplikasi tanpa project id
        # Firebase tidak bisa mengirim push sama sekali.
        #
        # Karena itu langkah ini GAGAL dengan pesan jelas kalau secret belum diisi,
        # berbeda dengan langkah keystore yang sengaja jatuh ke debug key.
        # "Build hijau" di sini berarti bukan berarti "aplikasi benar".
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "::error::secret GOOGLE_SERVICES_JSON_BASE64 belum diisi. tidak bisa membuat APK release dengan Firebase." >&2
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d \
            > android/app/google-services.json
          echo "  google-services.json dipakai"

      - name: Siapkan keystore rilis
        # Keystore TIDAK disimpan di repo. Workflow ini mengambilnya dari
        # secret KEYS_BASE64. Kalau secret belum diisi, build tetap jalan
        # dengan debug key supaya pipeline tidak macet, hanya saja hasilnya
        # tidak cocok untuk dibagikan karena ditandatangani debug.
        run: |
          if [ -n "${{ secrets.KEYS_BASE64 }}" ]; then
            echo "${{ secrets.KEYS_BASE64 }}" | base64 -d \
              > android/app/v3netbill-release.jks
            cat > android/key.properties <<EOF
          storeFile=v3netbill-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "  keystore rilis dipakai"
          else
            echo "  secret KEYS_BASE64 kosong, pakai debug key"
          fi

      - name: Tentukan nomor versi
        # PENTING: ini yang membuat fitur "cek pembaruan" di aplikasi bisa
        # bekerja. Seluruh 12 build sebelumnya punya versionCode = 1, jadi
        # aplikasi tidak punya satu pun angka yang bisa dibandingkan dengan APK
        # di server.
        #
        # Ruang nomor DIPISAH: CI selalu memakai 1000 + run_number, sedangkan
        # build lokal untuk uji coba memakai angka di bawah 1000. Tanpa
        # pemisahan ini keduanya bertabrakan. Yang sudah terjadi 30 Sep: build
        # lokal memakai 13/14/15, CI juga menghasilkan 13/14/15, jadi APK CI
        # bernomor 13 tidak bisa dipasang di HP yang sudah punya 15 (Android
        # menolak downgrade) dan nomor yang sama dipakai dua APK berbeda.
        #
        # Konsekuensi yang disengaja: setiap APK dari CI selalu dianggap lebih
        # baru oleh build lokal mana pun. Itu benar, karena APK CI adalah
        # rilis sungguhan sementara build lokal hanya untuk menguji.
        run: |
          echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "BUILD_NAME=1.0.$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Tampilkan nomor versi
        run: |
          echo "versi yang dipakai: $BUILD_NAME (versionCode $BUILD_NUMBER)"

      - name: Build APK release universal
        # Universal, bukan --split-per-abi, supaya hasilnya satu file yang bisa
        # dipasang di HP mana pun. Split per-ABI masih dipakai sebagai langkah
        # tambahan untuk yang mau mengunduh versi lebih kecil.
        run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL=https://v3netbill.bilmary.my.id/api \
            --dart-define=API_WS_URL=wss://v3netbill.bilmary.my.id/session

      - name: Build APK release per-ABI
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL=https://v3netbill.bilmary.my.id/api \
            --dart-define=API_WS_URL=wss://v3netbill.bilmary.my.id/session

      - name: Kumpulkan APK
        run: |
          mkdir -p apk
          # build/app/outputs/flutter-apk/*.apk
          cp build/app/outputs/flutter-apk/*.apk apk/ 2>/dev/null || true
          # APK per-ABI ada di direktori ini pada Flutter versi terbaru
          find build -name "*.apk" -exec cp {} apk/ \; 2>/dev/null || true
          ls -la apk/

      - name: Pastikan nomor versi benar-benar masuk ke APK
        # Jangan percaya "build succeeded". APK yang salah versi membuat setiap
        # HP kasir menampilkan penanda "pembaruan tersedia" yang tak pernah
        # bisa dibersihkan. Letakkan SETELAH "Kumpulkan APK", karena berkas
        # yang diperiksa baru ada setelah langkah itu.
        run: |
          if command -v aapt2 >/dev/null 2>&1; then
            aapt2=$(command -v aapt2)
          else
            aapt2=$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)aapt2
          fi
          badging=$("$aapt2" dump badging apk/app-release.apk | head -1)
          echo "$badging"
          case "$badging" in
            *"versionCode='$BUILD_NUMBER'"*) echo "versionCode sesuai ($BUILD_NUMBER)" ;;
            *) echo "GAGAL: versionCode APK tidak sama dengan $BUILD_NUMBER"; exit 1 ;;
          esac

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3netbill-apk-universal
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Ringkasan
        if: always()
        run: |
          echo "### APK ###"
          ls -la apk/ 2>/dev/null || echo "tidak ada APK"
