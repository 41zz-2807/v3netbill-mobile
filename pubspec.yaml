name: v3netbill_mobile
description: Aplikasi operator warnet v3Netbill untuk Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.7.0

  # State management. Provider dipilih karena lebih sederhana daripada Riverpod
  # untuk jumlah layar yang sekarang masih sedikit.
  provider: ^6.1.2

  # Penyimpanan token login
  flutter_secure_storage: ^9.2.2

  # Format angka dan tanggal gaya Indonesia
  intl: ^0.19.0

  # Realtime (WebSocket) untuk status PC
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
